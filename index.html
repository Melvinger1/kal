<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELAMAT ULANG TAHUN</title>
    <link rel="stylesheet" href="birthday_styles.css">
</head>
<body>
    <div class="container">
        <div class="birthday-card">
            <h1 class="greeting">SELAMAT ULANG TAHUN YANG KE-19!</h1>
            
            <div class="cake-container">
                <div class="cake">
                    <div class="candle">
                        <div class="flame"></div>
                    </div>
                    <div class="frosting"></div>
                    <div class="cake-body"></div>
                </div>
            </div>
            
            <div class="message-container">
                <p class="message">Happy Birthday!</p>
                <p class="name" id="nameDisplay">NESSA LAMANDA ALAY NISSA NUGRAHA</p>
            </div>
            
            <button class="celebrate-btn" id="celebrateBtn">KLIK AJA</button>
        </div>
        
        <div class="confetti" id="confettiContainer">
            <!-- Confetti will be generated here -->
        </div>
    </div>
    
    <script src="birthday_script.js"></script>
</body>
</html>
